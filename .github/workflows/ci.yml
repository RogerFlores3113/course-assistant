name: CI

"on":
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync --frozen --all-groups
      - run: uv run pytest -q --tb=short

      - name: Check install.sh syntax
        if: runner.os != 'Windows'
        run: bash -n install.sh
      - name: Check install.ps1 syntax
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile("$PWD\install.ps1", [ref]$null, [ref]$errors)
          if ($errors) { $errors | ForEach-Object { Write-Error $_.Message }; exit 1 }

  build:
    name: Build (${{ matrix.os }})
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            mcp_exe: "dist/Course Assistant.app/Contents/MacOS/Course Assistant"
          - os: windows-latest
            mcp_exe: "dist/Course Assistant/course-assistant-mcp.exe"
          - os: ubuntu-latest
            mcp_exe: "dist/Course Assistant/course-assistant"
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync --frozen --all-groups
      - run: uv run pyinstaller packaging/course-assistant.spec --noconfirm

      - name: Sign the Mac app (ad hoc) so the signed bundle is what gets tested
        if: runner.os == 'macOS'
        run: codesign --force --deep -s - "dist/Course Assistant.app"

      - name: Smoke test the MCP server inside the build
        run: uv run python packaging/smoke_mcp.py "${{ matrix.mcp_exe }}"
        shell: bash

      - name: Check one-click connect from the build
        run: uv run python packaging/check_connect.py "${{ matrix.mcp_exe }}"
        shell: bash

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: |
          cd dist && ditto -c -k --keepParent "Course Assistant.app" ../CourseAssistant-mac.zip
          # Disk image: the app plus an Applications shortcut to drag it onto.
          mkdir -p ../dmg-staging && cd ../dmg-staging
          cp -R "../dist/Course Assistant.app" .
          ln -s /Applications Applications
          cd ..
          hdiutil create -volname "Course Assistant" -srcfolder dmg-staging -ov -format UDZO CourseAssistant-mac.dmg
      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path "dist\Course Assistant" -DestinationPath CourseAssistant-windows.zip
      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: tar -czf CourseAssistant-linux.tar.gz -C dist "Course Assistant"

      - name: Test the install script against this build (macOS)
        if: runner.os == 'macOS'
        run: |
          mkdir -p "$RUNNER_TEMP/rel" "$RUNNER_TEMP/inst"
          cp CourseAssistant-mac.zip "$RUNNER_TEMP/rel/"
          (cd "$RUNNER_TEMP/rel" && shasum -a 256 CourseAssistant-mac.zip > SHA256SUMS.txt)
          COURSE_ASSISTANT_INSTALL_FROM="$RUNNER_TEMP/rel" COURSE_ASSISTANT_INSTALL_DIR="$RUNNER_TEMP/inst" sh install.sh --no-open
          test -x "$RUNNER_TEMP/inst/Course Assistant.app/Contents/MacOS/Course Assistant"
          uv run python packaging/smoke_mcp.py "$RUNNER_TEMP/inst/Course Assistant.app/Contents/MacOS/Course Assistant"
      - name: Test the install script against this build (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir -p "$RUNNER_TEMP/rel" "$RUNNER_TEMP/inst"
          cp CourseAssistant-linux.tar.gz "$RUNNER_TEMP/rel/"
          (cd "$RUNNER_TEMP/rel" && sha256sum CourseAssistant-linux.tar.gz > SHA256SUMS.txt)
          COURSE_ASSISTANT_INSTALL_FROM="$RUNNER_TEMP/rel" COURSE_ASSISTANT_INSTALL_DIR="$RUNNER_TEMP/inst" sh install.sh --no-open
          test -x "$RUNNER_TEMP/inst/Course Assistant/course-assistant"
          uv run python packaging/smoke_mcp.py "$RUNNER_TEMP/inst/Course Assistant/course-assistant"
      - name: Test the install script against this build (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $rel = Join-Path $env:RUNNER_TEMP 'rel'
          $inst = Join-Path $env:RUNNER_TEMP 'inst'
          New-Item -ItemType Directory -Path $rel -Force | Out-Null
          Copy-Item CourseAssistant-windows.zip $rel
          $hash = (Get-FileHash -Algorithm SHA256 (Join-Path $rel 'CourseAssistant-windows.zip')).Hash.ToLower()
          Set-Content -Path (Join-Path $rel 'SHA256SUMS.txt') -Value "$hash  CourseAssistant-windows.zip" -Encoding ascii
          $env:COURSE_ASSISTANT_INSTALL_FROM = $rel
          $env:COURSE_ASSISTANT_INSTALL_DIR = $inst
          & .\install.ps1 -NoOpen
          if (-not (Test-Path (Join-Path $inst 'course-assistant-mcp.exe'))) { throw 'installed course-assistant-mcp.exe is missing' }
          uv run python packaging/smoke_mcp.py (Join-Path $inst 'course-assistant-mcp.exe')

      - uses: actions/upload-artifact@v4
        with:
          name: CourseAssistant-${{ runner.os }}
          path: |
            CourseAssistant-*.zip
            CourseAssistant-*.dmg
            CourseAssistant-*.tar.gz

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Check the tag matches the version in pyproject.toml
        run: |
          tag="${GITHUB_REF_NAME#v}"
          ver="$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')"
          if [ "$tag" != "$ver" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match pyproject.toml version ${ver}" >&2
            exit 1
          fi
      - uses: actions/download-artifact@v4
        with:
          path: release-files
          merge-multiple: true
      - name: Write SHA256SUMS.txt
        run: |
          cd release-files
          sha256sum CourseAssistant-* > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release-files/*
