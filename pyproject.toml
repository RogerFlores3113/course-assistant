[project]
name = "course-assistant"
version = "0.1.0"
description = "Local-first study help for college students, grounded in their own course materials."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11,<4.0"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "jinja2>=3.1",
    "httpx>=0.27",
    "mcp>=1.9,<2",
    "platformdirs>=4.0",
    "python-multipart>=0.0.9",
    "pypdf>=5.0",
    "python-pptx>=1.0",
    "python-docx>=1.1",
    "anthropic>=0.70",
    "tzdata>=2024.1; sys_platform == 'win32'",
]

[project.optional-dependencies]
transcribe = ["faster-whisper>=1.0"]

[project.scripts]
course-assistant = "course_assistant.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/course_assistant"]

[dependency-groups]
dev = ["pytest>=8.0", "pyinstaller>=6.10"]

[tool.pytest.ini_options]
testpaths = ["tests"]
